# Full stack: `docker compose up --build`, then open http://localhost:8080 (demo login on the sign-in page).
# Local development only needs the database: `docker compose up -d postgres`.
# Values come from .env (copy .env.example); nothing secret is stored here.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-numera}
      POSTGRES_USER: ${POSTGRES_USER:-numera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - numera-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-numera} -d ${POSTGRES_DB:-numera}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The production image: the API also serves the Angular app (see Dockerfile).
  app:
    build:
      context: .
    environment:
      # GSS (Kerberos) encryption is not used; disabling it stops Npgsql looking for libgssapi, which the slim image lacks.
      ConnectionStrings__Numera: Host=postgres;Port=5432;Database=${POSTGRES_DB:-numera};Username=${POSTGRES_USER:-numera};Password=${POSTGRES_PASSWORD};Gss Encryption Mode=Disable
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env (at least 32 characters, see .env.example)}
      # Creates the schema and loads the demo data on the first start (an empty database only).
      Database__PrepareOnStartup: "true"
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  numera-pgdata:
