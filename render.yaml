# Render Blueprint for the live demo: one free Docker web service built from the root Dockerfile (the API also
# serves the Angular app). The database is a free Neon Postgres project, created separately (see README > Deploy).
# Secrets are never stored here: the signing key is generated by Render, the connection string is pasted in Render.
services:
  - type: web
    name: numera
    runtime: docker
    plan: free
    region: frankfurt # keep it close to the Neon region (AWS eu-central-1, Frankfurt)
    branch: main # releases only: dev is merged into main for each release
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Npgsql format, from the Neon dashboard (direct, not pooled, connection), for example:
      # Host=ep-xxxx.eu-central-1.aws.neon.tech;Database=neondb;Username=neondb_owner;Password=...;SSL Mode=Require;Gss Encryption Mode=Disable
      - key: ConnectionStrings__Numera
        sync: false
      # Random 256-bit base64 value (44 characters), created by Render on the first deploy.
      - key: Jwt__SigningKey
        generateValue: true
      # Creates the schema and loads the demo data on the first start (only into an empty database).
      - key: Database__PrepareOnStartup
        value: "true"
      # Render's proxy sets X-Forwarded-For; the login and reset rate limits then see the real client address.
      - key: ForwardedHeaders__Enabled
        value: "true"
      - key: PORT
        value: "8080"
