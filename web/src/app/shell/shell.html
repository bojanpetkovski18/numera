<div class="shell">
  <header class="topbar">
    <button
      type="button"
      class="menu-button"
      aria-controls="primary-nav"
      [attr.aria-expanded]="navOpen()"
      (click)="toggleNav()"
    >
      <span class="sr-only">Toggle navigation</span>
      <span aria-hidden="true">☰</span>
    </button>
    <span class="topbar-title">Harbor &amp; Pine Coffee</span>
    <span class="topbar-note">Demo data · fictional</span>
  </header>

  <nav id="primary-nav" class="sidebar" [class.open]="navOpen()" aria-label="Primary">
    <a class="brand" routerLink="/dashboard" (click)="closeNav()">Numera</a>
    <ul>
      @for (item of navItems; track item.path) {
        <li>
          <a
            [routerLink]="item.path"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            (click)="closeNav()"
            >{{ item.label }}</a
          >
        </li>
      }
    </ul>
  </nav>

  <main class="content">
    <router-outlet />
  </main>
</div>
